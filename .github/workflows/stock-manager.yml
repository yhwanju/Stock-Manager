name: Stock Manager

on:
  schedule:
    # KST Monday-Friday 07:50 = UTC Sunday-Thursday 22:50
    - cron: "50 22 * * 0-4"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  send-stock-report:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Show run context
        run: |
          echo "GitHub event: $GITHUB_EVENT_NAME"
          echo "Git ref: $GITHUB_REF"

      - name: Send stock report
        env:
          DISCORD_STOCK_WEBHOOK_URL: ${{ secrets.DISCORD_STOCK_WEBHOOK_URL }}
        run: python -u main.py
